<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon.png">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 20px;
}

h1 {
    color: #38bdf8;
}

.section {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #38bdf8;
    color: black;
}

.card {
    padding: 8px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.card:hover {
    background: #0f172a;
}
</style>
</head>

<body>

<h1>📊 Panel Admina</h1>

<div class="section">
    <h2>🟦 Dashboard</h2>
    <p>Kandydaci: <span id="count">0</span></p>
    <p>Testy dziś: <span id="today">0</span></p>
</div>

<div class="section">
    <h2>🟨 Kandydaci</h2>
    <div id="users"></div>
</div>

<div class="section">
    <h2>🟩 Profil kandydata</h2>
    <div id="profile">Kliknij kandydata</div>
</div>

<div class="section">
    <h2>🟪 Statystyki pytań</h2>
    <div id="stats"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, getDocs, collection } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6Dj7pjQO1bnujfufr5Mgvf9Xdqjb-pQ8",
  authDomain: "quizz-6918d.firebaseapp.com",
  projectId: "quizz-6918d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allData = [];

async function load() {

    const snap = await getDocs(collection(db, "wyniki"));

    allData = [];

    snap.forEach(doc => {
        allData.push(doc.data());
    });

    renderDashboard();
    renderUsers();
    renderStats();
}

// 🟦 DASHBOARD
function renderDashboard() {

    document.getElementById("count").innerText = allData.length;

    let today = new Date().toDateString();

    let todayCount = allData.filter(d => {
        if (!d.data) return false;
        return new Date(d.data.seconds * 1000).toDateString() === today;
    }).length;

    document.getElementById("today").innerText = todayCount;
}

// 🟨 LISTA KANDYDATÓW
function renderUsers() {

    let html = "";

    allData.forEach((u, i) => {
        html += `
            <div class="card" onclick="showProfile(${i})">
                ${u.gracz}
            </div>
        `;
    });

    document.getElementById("users").innerHTML = html;
}

// 🟩 PROFIL KANDYDATA
window.showProfile = function(i) {

    let u = allData[i];

    let html = `<h3>${u.gracz}</h3>`;

    u.wybory.forEach((w, j) => {
        html += `<p>${j+1}. ${w.pytanie}<br><b>${w.odpowiedz}</b></p>`;
    });

    document.getElementById("profile").innerHTML = html;
}

// 🟪 STATYSTYKI PYTAŃ
function renderStats() {

    let stats = {};

    allData.forEach(user => {
        user.wybory.forEach(w => {

            if (!stats[w.pytanie]) {
                stats[w.pytanie] = {};
            }

            if (!stats[w.pytanie][w.odpowiedz]) {
                stats[w.pytanie][w.odpowiedz] = 0;
            }

            stats[w.pytanie][w.odpowiedz]++;
        });
    });

    let html = "";

    for (let q in stats) {

        html += `<h4>${q}</h4>`;

        for (let a in stats[q]) {
            html += `<p>${a} → ${stats[q][a]}x</p>`;
        }

        html += "<hr>";
    }

    document.getElementById("stats").innerHTML = html;
}

load();

</script>

</body>
</html>
